{% set name = "synnotate" %}
{% set version = "0.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 8cf427f4c77a9056ad9d3798ac0865f1bc840694ff72a11559bea8b4512374ca

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - synnotate = synnotate.cli:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=64
  run:
    - python >=3.10
    - numpy >=1.24
    - pytorch >=2.1
    - faiss-cpu >=1.7
    - pandas >=2.0
    - pyarrow >=12
    - biopython >=1.81
    - pyrodigal >=3.0

test:
  imports:
    - synnotate
  commands:
    - synnotate --help
    - synnotate --version

about:
  home: https://github.com/khoa-yelo/Synnotate
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Genomic-context annotation of the prokaryotic and viral dark proteome"
  description: |
    Synnotate is an interpretable framework for annotating uncharacterized microbial and viral
    proteins from genomic context, beyond sequence and structural homology. It represents a gene's
    neighbourhood as standardized functional-annotation tokens and predicts the target gene's
    function with an additive context transformer, reporting a calibrated (isotonic) confidence, a
    trusted-region gate over confidence x synteny, exact per-neighbour attributions, and retrieved
    reference neighbourhoods. The model, vocabulary, and FAISS retrieval index are downloaded
    separately via `synnotate setup`. Neighbour annotation uses GFF product-string matching, a user
    table, eggNOG-mapper (prokaryote), or Pharokka (phage).
  dev_url: https://github.com/khoa-yelo/Synnotate

extra:
  recipe-maintainers:
    - khoa-yelo
